<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>damu</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#17223b;--mute:#5b6882;--line:#d6deec;--acc:#2447c9;--accT:#fff;--ok:#1f7a3d;--okb:#e4f4e8;--bad:#b3261e;--badb:#fbe9e7;--warn:#8a5a00;--warnb:#fdf3e0;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101828;--card:#19243a;--ink:#e7ecf7;--mute:#98a5c0;--line:#2b3a58;--acc:#8aa8ff;--accT:#0f1830;--ok:#66d08a;--okb:#16301f;--bad:#ff8f86;--badb:#3a1d1b;--warn:#ffcf7a;--warnb:#2e2410}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Be Vietnam Pro",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
header .logo{font-size:1.3rem}
header b{font-size:1.05rem}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:none;padding:8px 12px;min-height:44px;color:var(--mute);border-radius:8px}
nav button[aria-current]{background:var(--acc);color:var(--accT);font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px 12px 60px}
h1{font-size:1.45rem;margin:4px 0}.sub{color:var(--mute);margin:0 0 14px}
.msg{color:var(--mute)}.small{font-size:.85rem;color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stats b{display:block;font-size:1.6rem;line-height:1.2}.stats span{color:var(--mute);font-size:.85rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}.box h2{font-size:1rem;margin:0 0 8px}
details.box summary{cursor:pointer;font-weight:600;color:var(--acc);min-height:44px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;min-height:44px}
button.p{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
button.g{background:var(--okb);color:var(--ok);border-color:var(--ok);font-weight:600}
button.b{background:var(--badb);color:var(--bad);border-color:var(--bad);font-weight:600}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],input[type=password],textarea,input[type=file]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1;min-width:120px}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mute);gap:8px;flex-wrap:wrap}
.card,.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin-top:12px}
.tag{color:var(--mute);font-size:.85rem}
.q{font-size:1.25rem;font-weight:700;line-height:1.5;margin:6px 0 12px}
.a{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.hints{margin:10px 0}.hint{border-left:3px solid var(--acc);background:var(--bg);padding:8px 12px;margin:0 0 8px;border-radius:0 8px 8px 0}.hint b{display:block;font-size:.78rem;color:var(--acc);margin-bottom:2px}
.fb{color:#b45309;font-weight:600;margin:8px 0 0}
.res{border-radius:10px;padding:10px 12px;margin:10px 0}.res.ok{background:#ecfdf5;border:1px solid #a7f3d0}.res.bad{background:#fef2f2;border:1px solid #fecaca}
#ans{margin-top:10px;font-size:1.05rem}
.hw{font-size:2rem;font-weight:800;color:var(--acc);margin:0;line-height:1.2}
.ipa{color:var(--mute);font-size:1.05rem;margin:4px 0}
.spk{border-radius:50%;width:44px;height:44px;min-height:44px;padding:0;font-size:1.2rem;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:.9rem}
.pos{font-weight:700;color:var(--acc);margin:14px 0 4px;font-style:italic}
.def{margin:6px 0}.def .ex{color:var(--mute);font-size:.92rem;margin:2px 0 2px 12px;border-left:2px solid var(--line);padding-left:8px}
.synant{margin-top:10px}.synant b{font-size:.85rem;color:var(--mute)}
.notice{background:var(--warnb);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:.9rem}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc);width:0}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wrow .w{flex:1;min-width:0}.wrow .w b{font-size:1.05rem}.wrow .w small{display:block;color:var(--mute);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow button{min-height:40px;padding:6px 10px}
.up{position:relative;display:flex;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--mute);min-height:52px;overflow-wrap:anywhere;background:var(--bg)}
.up:focus-within{outline:3px solid var(--acc)}.up input{position:absolute;opacity:0;width:1px;height:1px}
footer{text-align:center;color:var(--mute);font-size:.8rem;margin:26px 0 10px}
#aimsgs{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:4px}
.amsg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:94%;overflow-wrap:anywhere}
.amsg b{display:block;font-size:.78rem;color:var(--mute);margin-bottom:2px}
.amsg.u{align-self:flex-end;background:var(--acc);border-color:var(--acc);color:var(--accT)}
.amsg.u b{color:var(--accT);opacity:.85}
.exvi{color:var(--mute);font-size:.88rem;margin:2px 0 2px 12px}
.mascot{width:1.3em;height:1.3em;vertical-align:-0.2em;border-radius:50%;object-fit:cover}
</style></head>
<body>
<header><span class="logo"><img class="mascot" id="capyLogo" alt="damu"></span><b>damu</b><nav id="nav"></nav></header>
<main id="main"></main>
<footer>Tiến độ lưu trong trình duyệt này · Không cần mạng trừ lúc tra từ điển / hỏi AI</footer>

/* ============ TIỆN ÍCH ============ */
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayStart(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function stripHtml(s){return String(s||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();}
function maskWord(w){w=String(w||'');if(!w)return'';var m=w[0];for(var i=1;i<w.length;i++)m+=' _';return m+' ('+w.length+' ký tự)';}
function blankExample(ex,word){try{var w=String(word||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(!w)return ex;return String(ex||'').replace(new RegExp(w,'gi'),'____');}catch(e){return ex;}}
function uniq(a){var s={},r=[];(a||[]).forEach(function(x){x=String(x||'').trim();if(x&&!s[x.toLowerCase()]){s[x.toLowerCase()]=1;r.push(x);}});return r;}
/* Chấm đáp án gõ: chuẩn hóa (bỏ dấu tiếng Việt), cho nhiều đáp án cách nhau , ; /, dung thứ 1 ký tự gõ sai nếu đáp án dài */
function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9,;\/ -]/g,'').replace(/\s+/g,' ').trim();}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length];}
function ok(c,v){var it=nz(v).split(/[,;\/]+/).map(function(x){return x.trim();}).filter(Boolean),hit={};it.forEach(function(x){(c.ans||[]).forEach(function(a,i){var n=nz(a);if(n&&(x===n||(n.length>5&&lev(x,n)<=1)))hit[i]=1;});});return Object.keys(hit).length>=(c.need||1);}

/* ============ TRA TỪ ĐIỂN (chạy ở trình duyệt) ============
   1) Wiktionary REST (chính, timeout 12s, thử lại 1 lần) -> 2) Datamuse bổ sung đồng/trái nghĩa (lỗi tự nuốt).
   dictionaryapi.dev đã XÓA khỏi chuỗi (chết/timeout, gây treo vô ích).
   Lỗi trung thực: 404 -> 'notfound' | mất mạng thật -> 'offline' | chậm/timeout -> 'slow:host' | bị chặn -> 'blocked:host' | còn lại -> 'sourceerror'. */
/* FIX 1: AbortSignal.timeout không có trên trình duyệt cũ -> try/catch, fallback fetch thường (không timeout) thay vì TypeError đồng bộ */
function fetchTimeout(url,ms,opts){var sig=null;try{sig=AbortSignal.timeout(ms||15000);}catch(e){}var o={};if(opts)for(var k in opts)o[k]=opts[k];if(sig)o.signal=sig;return fetch(url,o);} /* FIX 2026-10-15 (#6): thêm opts (method/body) cho test POST Google AI của netDiag */
/* Phân loại lỗi mạng TRUNG THỰC (không gán bừa "mất mạng"):
   offline = trình duyệt báo mất mạng thật | slow = máy chủ quá chậm/timeout
   blocked = kết nối bị chặn (tường lửa/DNS/CORS) trong khi máy vẫn online | sourceerror = lỗi khác */
function classifyNetErr(e,host){
  var name=String(e&&e.name||''),msg=String(e&&e.message||'');
  try{if(typeof navigator!=='undefined'&&'onLine'in navigator&&!navigator.onLine)return new Error('offline');}catch(x){}
  if(/abort|timeout/i.test(name)||/abort|timeout|timed out/i.test(msg))return new Error('slow:'+host);
  if(/failed to fetch|networkerror|network request failed|load failed/i.test(msg))return new Error('blocked:'+host);
  return new Error('sourceerror');
}
/* Chẩn đoán kết nối: test từng máy chủ, báo rõ cái nào sống/chết + lỗi thật (tiếng Việt) */
var netDiagState={running:false,rows:[]};
async function netDiag(){
  if(netDiagState.running)return;
  netDiagState={running:true,rows:[]};render();
  /* FIX 2026-10-15 (#6): test ĐÚNG 5 endpoint thật app dùng, kèm phương thức gọi */
  var tests=[
    ['Tra từ (Wiktionary)','GET','https://en.wiktionary.org/api/rest_v1/page/definition/hello'],
    ['Đồng/trái nghĩa (Datamuse)','GET','https://api.datamuse.com/words?rel_syn=happy&max=1'],
    ['Dịch tự động (MyMemory)','GET','https://api.mymemory.translated.net/get?q=hello&langpair=en|vi'],
    ['Bot AI damu (Pollinations, không key)','GET','https://text.pollinations.ai/hello'],
    ['Mạng chung (đối chứng)','GET','https://www.google.com/generate_204']
  ];
  for(var i=0;i<tests.length;i++){
    var name=tests[i][0],method=tests[i][1],url=tests[i][2],t0=Date.now(),st;
    try{
      /* (d) Pollinations keyless: nhận được HTTP 200 tức là bot AI damu tới được */
      var r=method==='POST'
        ?await fetchTimeout(url,10000,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"contents":[{"role":"user","parts":[{"text":"hi"}]}]}'})
        :await fetchTimeout(url,10000);
      var secs=((Date.now()-t0)/1000).toFixed(1),http=r.status,ok,tag='';
      ok=r.ok;if(i===4&&!ok)tag='(endpoint này không có CORS nên trình duyệt chặn — fail là bình thường, bỏ qua)';
      st={name:name,ok:ok,http:http,ms:secs,tag:tag,why:''};
    }catch(e){
      var em=String(e&&e.message||e),en=String(e&&e.name||''),secs2=((Date.now()-t0)/1000).toFixed(1);
      var why=/abort|timeout/i.test(en+em)?'máy chủ phản hồi quá chậm hoặc không tới được'
        :/failed to fetch|networkerror|load failed/i.test(em)?'kết nối bị chặn (tường lửa/DNS của mạng bạn)'
        :'lỗi: '+em;
      if(i===4)why+=' (endpoint này không có CORS nên trình duyệt chặn — fail là bình thường, bỏ qua)';
      st={name:name,ok:false,http:'—',ms:secs2,tag:'',why:why};
    }
    netDiagState.rows.push(st);render();
  }
  netDiagState.running=false;render();
}
function netDiagHTML(){
  var s=netDiagState;
  var h='<div class="box"><h2>🔧 Kiểm tra kết nối</h2><p class="msg">Bấm để kiểm tra máy bạn có tới được từng máy chủ mà app thật sự dùng không (mất khoảng 15 giây).</p><div class="row"><button class="p" onclick="netDiag()"'+(s.running?' disabled':'')+'>'+(s.running?'Đang kiểm tra…':'Kiểm tra ngay')+'</button></div>';
  if(s.rows.length){
    h+='<div style="margin-top:8px">'+s.rows.map(function(r){
      return '<div class="wrow"><div class="w"><b>'+(r.ok?'✅':'❌')+' '+esc(r.name)+'</b><small>'+(r.ok?'Tới được':'Không tới được')+' · HTTP '+esc(String(r.http))+' · '+esc(r.ms)+' giây'+(r.tag?' · '+esc(r.tag):'')+(r.why?' · '+esc(r.why):'')+'</small></div></div>';
    }).join('')+'</div>';
    if(s.rows.length===5&&!s.running){
      /* FIX 2026-10-15 (#6): verdict chỉ tính 4 endpoint chính — điểm đối chứng Google
         (generate_204) không có CORS nên fail là bình thường, không được gán bừa
         "mạng chặn mọi kết nối" khi 4 API chính vẫn tốt. */
      var mains=s.rows.slice(0,4);
      var bad=mains.filter(function(r){return !r.ok;});
      var g204=s.rows[4];
      var verdict;
      if(bad.length===0){
        verdict='<b>4/4 máy chủ chính đều tới được.</b> '+(g204.ok?'Điểm đối chứng Google cũng OK.':'Điểm đối chứng Google fail là bình thường (không có CORS, bỏ qua).')+' Nếu tra từ/AI vẫn lỗi, chụp màn hình lỗi gửi tôi nhé.';
      }else{
        verdict='Không tới được: <b>'+bad.map(function(r){return esc(r.name)+' (HTTP '+esc(String(r.http))+')';}).join(', ')+'</b>. Thử tắt tiện ích chặn quảng cáo (AdBlock/uBlock), hoặc phát wifi từ điện thoại cho laptop dùng rồi kiểm tra lại. Chụp màn hình khung này gửi tôi nhé.';
      }
      h+='<p class="msg"><b>Kết luận:</b> '+verdict+'</p>';
      h+='<div class="row"><button onclick="netCopyReport()">📋 Chép báo cáo</button><span class="small">Chép toàn bộ kết quả dạng chữ để dán gửi tôi.</span></div>';
    }

/* FIX Lỗi chặn 1: lấy IPA text + audio phát âm THẬT từ Wiktionary (rest_v1/page/html).
   normDict2 gán cứng phonetic/audio='' vì endpoint /page/definition không có IPA.
   - Chỉ quét mục "English" để không nhầm IPA của ngôn ngữ khác.
   - Audio: ưu tiên file mp3 (Safari cũng phát được), tên file phát âm En-*-{word} trước.
   - Lỗi/timeout -> {} (bỏ qua êm, nút 🔊 fallback sang TTS như cũ). */
async function wiktPron(word){
  try{
    /* FIX 7: timeout 12s -> 6s (đã chuyển ra chạy nền, không thiết yếu, không được chặn kết quả chính) */
    var r=await fetchTimeout('https://en.wiktionary.org/api/rest_v1/page/html/'+encodeURIComponent(word),6000);
    if(!r.ok)return {};
    var h=await r.text();
    var a=h.indexOf('id="English"'),eng=a>=0?h.slice(a):h;
    if(a>=0){var h2=eng.indexOf('<h2',20);if(h2>0)eng=eng.slice(0,h2);}
    var out={};
    var m=eng.match(/<span class="IPA[^"]*"[^>]*>([^<]{1,60})<\/span>/);
    if(m){var ipa=stripHtml(m[1]).trim();if(/^[\/\[]/.test(ipa))out.phonetic=ipa;}
    var urls=[],re=/(?:https?:)?\/\/upload\.wikimedia\.org\/[^"'<>\s]+\.(mp3|ogg|oga)/gi,mm;
    while((mm=re.exec(eng))&&urls.length<8)urls.push(mm[0]);
    var wl=String(word||'').toLowerCase(),pick=null,i,ul;
    for(i=0;i<urls.length&&!pick;i++){ul=urls[i].toLowerCase();if(/\.mp3$/.test(ul)&&ul.indexOf(wl)>=0)pick=urls[i];}
    for(i=0;i<urls.length&&!pick;i++){ul=urls[i].toLowerCase();if(/\.mp3$/.test(ul))pick=urls[i];}
    if(!pick&&urls.length)pick=urls[0];
    if(pick){pick=stripHtml(pick);out.audio=pick.indexOf('http')===0?pick:'https:'+pick;}
    return out;
  }catch(e){return {};}
}

async function dictLookup(word,opts){
  word=String(word||'').trim().toLowerCase();if(!word)throw new Error('empty'); /* FIX 6: lowercase phòng thủ — Wiktionary phân biệt hoa/thường ("As far as" -> 404 oan ở đường upload) */
  /* 1) Wiktionary REST (nguồn chính, timeout 12s, thất bại mạng thì thử lại 1 lần) */
  var lastErr=null;
  for(var attempt=0;attempt<2;attempt++){
    try{
      var r=await fetchTimeout('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(word),12000);
      if(r.status===404)throw new Error('notfound');
      if(!r.ok)throw new Error('HTTP '+r.status);
      var j=await r.json();
      var n=normDict2(word,j);
      if(!n.meanings.length)throw new Error('notfound');
      /* FIX 3: TRẢ KẾT QUẢ CHÍNH NGAY sau Wiktionary — tab Tra từ render sớm,
         Datamuse/IPA chạy nền trong doLookup() nên không chặn UI (trước đây await tuần tự ~49s).
         Đường upload/batch (importParsed, batchLookup) truyền {enrich:true} để vẫn nhận đủ
         syn/ant/IPA/audio vì chúng phụ thuộc các trường này. */
      if(opts&&opts.enrich){
        await Promise.all([
          datamuseEnrich(n).catch(function(e){console.warn('[dictLookup] Datamuse enrich lỗi:',e&&e.message||e);}),
          wiktPron(word).then(function(pr){if(pr.phonetic&&!n.phonetic)n.phonetic=pr.phonetic;if(pr.audio&&!n.audio)n.audio=pr.audio;}).catch(function(){})
        ]);
      }
      return n;
    }catch(e){
      console.warn('[dictLookup] Wiktionary lỗi (lần '+(attempt+1)+'): '+(e&&e.name||'')+' '+(e&&e.message||e));
      if(e&&e.message==='notfound')throw e; /* 404 thật: không thử lại */
      lastErr=e;
      if(!attempt)await new Promise(function(res){setTimeout(res,800);});
    }
  }
  throw classifyNetErr(lastErr,'en.wiktionary.org');
}

/* Việc mới 2: trích nghĩa Việt GỌN từ chú thích trong ngoặc ở cột forms.
   vd forms.V="convince (thuyết phục)" -> ["thuyết phục"].
   Quy tắc lọc: mỗi mảnh dài <=30 ký tự, phải chứa ký tự tiếng Việt có dấu,
   loại ghi chú kiểu quốc gia dùng ("chủ yếu Mỹ", "Mỹ", "Anh", "Úc").
   Trả về mảng sắp xếp NGẮN NHẤT trước — phần tử [0] là viGloss chính. */
function extractViGloss(forms){
  var out=[];

    var v=forms&&forms[k];if(!v)return;
    (String(v).match(/\([^()]*\)/g)||[]).forEach(function(p){
      p.replace(/[()]/g,'').trim().split(/[;,\/]/).forEach(function(x){
        x=x.trim();if(!x||x.length>30)return;
        if(!/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(x))return;
        var isCountryNote=x.split(/\s+/).some(function(t){return /^(mỹ|anh|úc)$/i.test(t.replace(/[.,;:]/g,''));});
        if(isCountryNote)return;
        if(out.indexOf(x)<0)out.push(x);

  });

/* Rút gọn nghĩa Việt dài thành đáp án ngắn gọn cho thẻ en-vi:
   - trả về nguyên chuỗi nếu <=40 ký tự
   - nếu dài hơn: cắt ở dấu ';' hoặc ',' đầu tiên, trim, chỉ nhận nếu 2–40 ký tự
   - ngược lại trả '' (thẻ en-vi sẽ không được tạo) */
function shortVi(s){
  s=String(s||'').trim();
  if(!s)return '';
  if(s.length<=40)return s;
  var i=s.indexOf(';'),j=s.indexOf(','),cut=-1;
  if(i>=0&&j>=0)cut=Math.min(i,j);else cut=Math.max(i,j);
  if(cut<0)return '';
  var t=s.slice(0,cut).trim();
  return (t.length>=2&&t.length<=40)?t:'';
}

    var va=w.viGloss||shortVi(w.vi)||shortVi(w.viAuto)||'';
    if(!va)return null;

      aHTML:fullEntryHTML(w),

  }
  if(kind==='pos'){
    var poss=uniq((w.meanings||[]).map(function(m){return String(m.pos||'').toLowerCase().trim();}).filter(Boolean));
    if(!poss.length)return null;
    var viAns=poss.map(function(p){return POSL[p]||'';}).filter(Boolean);

  }
  if(kind.indexOf('forms-')===0){
    var fk=kind.slice(6),fv=w.forms&&w.forms[fk];
    if(!fv||!FORMSL[fk])return null;
    var fvars=[]; /* bỏ chú thích trong ngoặc, tách biến thể bằng , ; */
    String(fv).replace(/\([^()]*\)/g,'').split(/[,;]/).forEach(function(x){x=x.trim();if(x&&fvars.indexOf(x)<0)fvars.push(x);});
    if(!fvars.length)return null;
    return {q:'Dạng '+FORMSL[fk]+' của «'+esc(w.word)+'» là gì?',
      aHTML:fullEntryHTML(w),ans:fvars,need:1,hints:makeHints(w,kind)};
  }
  return null;
}

function refreshCards(wordId){ /* cập nhật lại q/a/hints/ans khi dữ liệu từ đổi */

async function doLookup(){
  var my=++dictSeq; /* FIX 4: chống race — lookup cũ về sau thì bỏ, chỉ hiện kết quả mới nhất */
  var inp=$('dw');if(!inp)return;var w=inp.value.trim().toLowerCase();
  if(!w)return;
  dictQ=w; /* FIX Lỗi B: đồng bộ state trước khi render để không mất chữ đang gõ */
  dictState={loading:true,word:w,data:null,error:'',added:false};render();var _i0=$('dw');if(_i0){_i0.value=dictQ;_i0.focus();}
  try{
    var d=await dictLookup(w);
    if(my!==dictSeq)return; /* FIX 4: đã có lookup mới hơn — bỏ kết quả cũ này */
    dictState={loading:false,word:w,data:d,error:'',added:false};
    /* FIX 3: làm giàu NỀN sau khi đã hiện kết quả chính — Datamuse (đồng/trái nghĩa, timeout 12s)
       + Wiktionary IPA/audio (timeout 6s). Mỗi cái tự try/catch, lỗi tự nuốt, patch dần vào
       kết quả rồi render lại. Bỏ qua nếu user đã tra từ khác. IPA/audio là nice-to-have. */
    (function(word,entry,myBg){
      Promise.all([
        datamuseEnrich(entry).catch(function(e){console.warn('[dict] Datamuse nền lỗi:',e&&e.message||e);}),
        wiktPron(word).catch(function(){return {};})
      ]).then(function(rs){
        if(myBg!==dictSeq)return; /* đã có lookup mới hơn — bỏ */
        if(dictState.word!==word||!dictState.data||dictState.data!==entry)return; /* user đã tra từ khác — bỏ */
        var pr=rs[1]||{};
        if(pr.phonetic&&!dictState.data.phonetic)dictState.data.phonetic=pr.phonetic;
        if(pr.audio&&!dictState.data.audio)dictState.data.audio=pr.audio;
        /* syn/ant đã được datamuseEnrich gán trực tiếp vào entry (=dictState.data) */
        if(view==='dict'){render();var i=$('dw');if(i){i.value=dictQ;i.focus();}}
      });
    })(w,d,my);
    /* Việc mới 1: dịch nghĩa Việt nền bằng MyMemory — không chặn UI, hiển thị khi có, lỗi tự nuốt */
    (function(word,entry){
      var en=firstDefText(entry);
      if(!en)return;
      myMemoryVi(en).then(function(vi){
        if(!vi)return;
        if(dictState.word!==word||!dictState.data||dictState.data!==entry)return; /* user đã tra từ khác thì bỏ */
        dictState.data.viAuto=vi;
        /* FIX 5: viAuto về muộn — nếu từ đã được thêm vào bộ nhớ trước đó thì đồng bộ
           viAuto vào S.words + tạo lại thẻ (để thẻ Anh→Việt xuất hiện) */
        var id=findWordId(word);
        if(id){var _w=getWord(id);
          /* chỉ lấp vi khi từ chưa có nghĩa Việt (không ghi đè nghĩa do user tự nhập), viAuto luôn cập nhật */
          upsertWord({word:word,vi:(_w&&_w.vi)?'':vi,viAuto:vi});
          makeCards(id);
        }
        if(view==='dict'){render();var i=$('dw');if(i){i.value=dictQ;i.focus();}}
      });
    })(w,d);
    /* FIX: dịch nền ví dụ tiếng Anh đầu tiên sang Việt (d.exVi) — không chặn UI, lỗi tự nuốt */
    (function(word,entry){
      translateExample(entry).then(function(got){
        if(!got)return;
        if(dictState.word!==word||!dictState.data||dictState.data!==entry)return; /* user đã tra từ khác thì bỏ */
        if(view==='dict'){render();var i=$('dw');if(i){i.value=dictQ;i.focus();}}
      });
    })(w,d);
  }catch(e){
    var code=String(e&&e.message||'');
    var msg=code==='offline'?'Mất mạng rồi — kiểm tra kết nối internet rồi tra lại nhé.'
      :code==='empty'?'Nhập từ cần tra đã chứ.'
      :code==='notfound'?'Không tìm thấy "'+w+'" trong từ điển. Kiểm tra lại chính tả nhé.'
      :code.indexOf('slow:')===0?'Máy chủ từ điển phản hồi quá chậm (hơn 12 giây). Thử tra lại nhé.'
      :code.indexOf('blocked:')===0?'Không kết nối được tới máy chủ từ điển. Có thể mạng của bạn đang chặn nó — kéo xuống cuối trang (hoặc sang tab Trợ lý AI) bấm nút "Kiểm tra ngay" để xem chi tiết nhé.'
      :'Nguồn từ điển đang lỗi, thử lại sau vài phút nhé.';
    dictState={loading:false,word:w,data:null,error:msg,added:false};
  }
  render();var i=$('dw');if(i){i.value=dictQ;i.focus();}
}

function isWorksheetText(t){return /Đồng nghĩa\s*:/.test(t)||/Trái nghĩa\s*:/.test(t);}
// parseWorksheet(text): parse raw text (mammoth.extractRawText) của
// "Grammar Worksheet #1: từ vựng, giới từ và từ loại" thành mảng:
// [{word, vi, prep, syn[], ant[], forms:{V,N,Adj,Adv}}]
// Chỉ lấy 25 từ là ĐÁP ÁN đúng của mỗi câu (dòng "(đáp án)"), bỏ 3 đáp án sai.
function parseWorksheet(text) {
  var lines = String(text).split(/\r?\n/).map(function (l) { return l.trim(); });

  // ---- 1. Đọc bảng đáp án: "1. D. convince" -> {1:'convince', ...}
  var answerKey = {};
  for (var i = 0; i < lines.length; i++) {
    if (/^Câu 1$/.test(lines[i])) break;
    var m = lines[i].match(/^(\d{1,2})\.\s*[A-D]\.\s*(.+)$/);
    if (m) answerKey[m[1]] = m[2].trim();
  }

  // ---- 2. Cắt text thành từng khối "Câu N" ... "Câu N+1"
  var blocks = [];
  var cur = null;
  lines.forEach(function (l) {
    var q = l.match(/^Câu (\d{1,2})$/);
    if (q) { cur = { num: q[1], lines: [] }; blocks.push(cur); }
    else if (cur) cur.lines.push(l);
  });

  // Dòng "từ vựng" (bắt đầu 1 entry): chữ cái Latin, khoảng trắng, gạch nối,
  // nháy đơn, gạch chéo — không chứa dấu hai chấm, không chữ Việt.
  function isWordLine(l) {
    return /^[A-Za-z][A-Za-z\s\-'\/]*$/.test(l) && l.length <= 40;
  }
  function splitList(s) {
    return String(s).split(/[,;]/).map(function (x) {
        return x.trim().replace(/\s*\([^()]*\)\s*$/, ''); // bỏ chú thích "(...)" cuối cụm
      })
      .filter(function (x) { return x && x !== '—' && x !== '-' && x.toLowerCase() !== 'không có'; });
  }
  function isVi(s) { return /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(s); }
  var NOISE_PAREN = /^\s*(đúng (với )?câu này|anh|mỹ|không có)\s*$/i;

  var results = [];

  blocks.forEach(function (b) {
    var answerWord = answerKey[b.num];
    if (!answerWord) return;

    // ---- 3. Tách các entry trong khối: mỗi entry bắt đầu ở dòng từ vựng.
    // Quét theo trạng thái: sau khi đã thấy "Đồng nghĩa:"/"Trái nghĩa:"/forms,
    // dòng từ-vựng tiếp theo (hoặc "Phân biệt"/hết khối) là ranh giới entry.
    var entries = [];
    var entry = null, seenSyn = false, seenAnt = false, seenForm = false;
    function closeEntry() {
      if (entry && entry.word) entries.push(entry);
      entry = null; seenSyn = false; seenAnt = false; seenForm = false;
    }
    b.lines.forEach(function (l) {
      if (!l) return;
      if (/^Phân biệt/.test(l)) { closeEntry(); entry = { skip: true }; return; }
      if (entry && entry.skip) return;
      if (isWordLine(l) && !entry) {
        entry = { word: l, prep: [], syn: [], ant: [], forms: {} };
        return;
      }
      if (!entry) return; // header "Từ / Giới từ... / Đồng nghĩa / Từ loại..." -> bỏ qua
      if (l === '(đáp án)') { entry.isAnswer = true; return; }
      if (/^Đồng nghĩa\s*:/.test(l)) {
        seenSyn = true;
        entry.syn = splitList(l.replace(/^Đồng nghĩa\s*:\s*/, ''));
        return;
      }
      if (/^Trái nghĩa\s*:/.test(l)) {
        seenAnt = true;
        entry.ant = splitList(l.replace(/^Trái nghĩa\s*:\s*/, ''));
        return;
      }
      var fm = l.match(/^(V|N|Adj|Adv|Modal verb|Prep)\s*:\s*(.+)$/);
      if (fm && seenSyn) {
        seenForm = true;
        var k = fm[1];
        var val = fm[2].trim();
        if (k === 'Modal verb' || k === 'Prep') {
          entry.prep.push(l); // "Modal verb: should + V" là ghi chú cách dùng
        } else {
          // tách các đoạn "V: ...; Adj: ..." nếu dính trong cùng 1 dòng
          val.split(/\s*;\s*/).forEach(function (seg) {
            var sm = seg.match(/^(V|N|Adj|Adv)\s*:\s*(.+)$/);
            var kk = sm ? sm[1] : k;
            var vv = sm ? sm[2].trim() : seg.trim();
            entry.forms[kk] = entry.forms[kk] ? entry.forms[kk] + '; ' + vv : vv;
          });
        }
        return;
      }
      if (l === '—' && seenSyn) { seenForm = true; return; } // entry không có từ loại
      // Ranh giới: đã qua syn/ant/forms mà gặp dòng từ-vựng mới -> entry mới
      if ((seenSyn || seenAnt || seenForm) && isWordLine(l)) {
        closeEntry();
        entry = { word: l, prep: [], syn: [], ant: [], forms: {} };
        return;
      }
      entry.prep.push(l); // các dòng giới từ & cách dùng
    });
    closeEntry();

    // ---- 4. Chỉ giữ entry của đáp án đúng
    var ans = entries.filter(function (e) {
      return e.isAnswer || e.word.toLowerCase() === answerWord.toLowerCase();
    })[0];
    if (!ans) return;

    // ---- 5. Rút nghĩa Việt (file không ghi "nghĩa:" riêng, phải suy từ ngữ cảnh):
    //   ưu tiên 1: dòng "Dùng khi..." (giải thích cách dùng = nghĩa trong ngữ cảnh)
    //   ưu tiên 2: dạng "pattern: nghĩa Việt" mà phần sau dấu ":" chủ yếu là tiếng Việt
    //   ưu tiên 3: cụm Việt trong ngoặc đơn ở phần giới từ (KHÔNG lấy từ forms
    //              để tránh nhầm nghĩa của từ phái sinh khác, vd "opportunist (kẻ cơ hội)")
    var vi = '';
    function stripAnswerNote(s) {
      return s.replace(/\s*\((đúng (với )?câu này)\)/gi, '').trim();
    }
    var cands = [];
    ans.prep.forEach(function (raw) {
      var s = stripAnswerNote(raw);
      if (/^(Đồng nghĩa|Trái nghĩa|Phân biệt)\b/.test(s)) return;
      if (!isVi(s)) return;
      if (/^Dùng khi/.test(s)) { cands.push({ s: s, w: 3 }); return; }
      var m2 = s.match(/^[^:]{1,50}:\s*(.+)$/); // cho ngoặc đơn trong head: "provided (that) + mệnh đề: ..."
      var tail = m2 ? m2[1] : s;
      if (/=/.test(tail)) tail = tail.split('=').pop().trim(); // "what I should do = tôi nên làm gì"
      tail = tail.replace(/\s*\([^()]*\)/g, '').trim();
      if (!isVi(tail)) return;
      // loại dòng mẫu tiếng Anh lẫn từ Việt ("convince sb that + mệnh đề"):
      // nghĩa Việt thật không bao giờ chứa sb/sth hay dấu "+"
      var hasPlaceholder = /\b(sb|sth)\b/i.test(tail) || /\+/.test(tail);
      if (!hasPlaceholder) cands.push({ s: tail, w: m2 ? 2 : 1 });
    });
    cands.sort(function (a, b) { return b.w - a.w; });
    if (cands.length) vi = cands[0].s;
    if (!vi) {
      var parens = ans.prep.join('\n').match(/\([^()]*\)/g) || [];
      for (var p = 0; p < parens.length; p++) {
        var inner = parens[p].replace(/[()]/g, '').trim();
        if (isVi(inner) && inner.length > 1 && !NOISE_PAREN.test(inner)) {
          vi = inner.split(';')[0].trim();
          break;
        }
      }
    }

    /* Việc mới 2: nghĩa Việt gọn từ chú thích trong ngoặc ở cột forms (luôn set, kể cả '' để không undefined) */
    var _gl=extractViGloss(ans.forms);
    results.push({
      word: ans.word,
      vi: vi,
      viGloss:_gl.length?_gl[0]:'',
      prep: ans.prep.join('\n'),
      syn: ans.syn,
      ant: ans.ant,
      forms: ans.forms
    });
  });

  return results;
}

function parseLines(text){
  var out=[];
  String(text||'').split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line||line[0]==='#')return;
    var m=line.match(/^(.+?)\s+[-–—]\s+(.+)$/)||line.match(/^(.+?)\s*[|:：\t]\s*(.+)$/);
    if(m)out.push({word:m[1].trim(),vi:m[2].trim()});
    else out.push({word:line,vi:''});
  });
  return out;
}

  return h;

function currentParsed(){if(!addState.fileText)return[];return addState.isWS?parseWorksheet(addState.fileText):parseLines(addState.fileText);}
async function onUpFile(){
  var f=$('uf').files[0];if(!f)return;
  try{
    var n=f.name.toLowerCase(),t;
    if(n.endsWith('.docx')){
      if(typeof mammoth==='undefined')throw new Error('Không tải được bộ đọc .docx, hãy dùng file .txt.');
      t=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
    }else t=await f.text();
    addState.isWS=isWorksheetText(t);
    var cnt=addState.isWS?parseWorksheet(t).length:parseLines(t).length;
    addState.fileName=f.name+' ('+cnt+(addState.isWS?' từ worksheet':' dòng')+')';addState.fileText=t;
  }catch(e){addState.fileName='Lỗi: '+e.message;addState.fileText='';}
  render();
}
async function importParsed(list,src,isWS){
  if(!list||!list.length){note='Chưa có gì để thêm.';render();return;}
  var added=0,skipped=0,merged=0,newIds=[];
  list.forEach(function(it){
    if(!it.word)return;
    var id=findWordId(it.word);
    if(id&&!isWS){skipped++;return;} /* file thường: bỏ qua từ đã có */
    if(id)merged++;else added++;
    /* worksheet: gộp prep/forms/syn/ant vào từ đã có — dữ liệu file được ưu tiên */
    newIds.push(upsertWord({word:it.word,vi:it.vi,viGloss:it.viGloss,syn:it.syn,ant:it.ant,prep:it.prep,forms:it.forms}));
  });
  /* Bù trường còn thiếu bằng từ điển (worksheet có thể thiếu vi/syn/ant); giới hạn 40 từ/lượt */
  var needy=newIds.filter(function(id){var w=getWord(id);return w&&(!(w.meanings&&w.meanings.length)||!(w.syn&&w.syn.length)||!(w.ant&&w.ant.length)||(!w.viGloss&&(!w.vi||w.vi.length>40)));});
  var LIMIT=40,enr=Math.min(needy.length,LIMIT),okn=0,fail=[],botMiss=[];
  addState.failed=[];
  for(var i=0;i<enr;i++){
    var w=getWord(needy[i]);if(!w)continue;
    addState.progress='Đang tra từ điển: '+w.word+' ('+(i+1)+'/'+enr+')…';render();
    var bar=$('pbar');if(bar)bar.style.width=Math.round(i/enr*100)+'%';
    try{
      var d=await dictLookup(w.word,{enrich:true}); /* FIX 3: đường upload/batch cần đủ syn/ant/IPA/audio đã làm giàu */
      var patch={word:w.word}; /* chỉ bù phần thiếu, không ghi đè dữ liệu file */
      if(!(w.meanings&&w.meanings.length)&&d.meanings.length)patch.meanings=d.meanings;
      if(!(w.syn&&w.syn.length)&&d.syn.length)patch.syn=d.syn;
      if(!(w.ant&&w.ant.length)&&d.ant.length)patch.ant=d.ant;
      if(!w.phonetic&&d.phonetic)patch.phonetic=d.phonetic;
      if(!w.audio&&d.audio)patch.audio=d.audio;
      upsertWord(patch);
      /* 2026-10-24 (bot damu keyless): từ điển còn thiếu syn/ant/nghĩa Việt thì bot bù bằng
         1 lượt Pollinations gọn. Bot lỗi/không đọc được -> GIỮ NGUYÊN dữ liệu từ điển và
         ghi vào botMiss để báo trung thực ở cuối lượt — TUYỆT ĐỐI không bịa dữ liệu. */
      var _w2=getWord(needy[i]);
      if(_w2&&(!(_w2.syn&&_w2.syn.length)||!(_w2.ant&&_w2.ant.length)||(!_w2.viGloss&&!_w2.vi))){
        try{
          var be=await botEnrichWord(w.word);
          if(be){
            var bp={word:w.word};
            if(!(_w2.syn&&_w2.syn.length)&&be.syn.length)bp.syn=be.syn;
            if(!(_w2.ant&&_w2.ant.length)&&be.ant.length)bp.ant=be.ant;
            if(!_w2.viGloss&&!_w2.vi&&be.vi)bp.vi=be.vi;
            if(bp.syn||bp.ant||bp.vi)upsertWord(bp);
          }else botMiss.push(w.word);
        }catch(be2){botMiss.push(w.word);}
      }
      /* Việc mới 2: chưa có viGloss mà w.vi dài/rỗng -> dịch máy định nghĩa EN làm phương án
         dự phòng, lưu vào viAuto (thẻ en-vi sẽ dùng). Dùng chung delay 600ms bên dưới. */
      if(!w.viGloss&&(!w.vi||w.vi.length>40)){
        var defEn=firstDefText(w);
        if(defEn){
          var via=await myMemoryVi(defEn);
          if(via)upsertWord({word:w.word,viAuto:via});
        }
      }
      /* FIX: dịch nền ví dụ tiếng Anh đầu tiên sang Việt, lưu vào defs[].exVi */
      try{var _sw=getWord(needy[i]);if(_sw&&await translateExample(_sw))save();}catch(x){}
      okn++;
    }catch(e){
      /* Từ điển lỗi hẳn -> thử bot damu keyless làm nguồn bù duy nhất; bot cũng lỗi
         thì mới ghi fail (báo trung thực trong note cuối lượt, không làm giàu giả). */
      var be3=null;try{be3=await botEnrichWord(w.word);}catch(x){}
      if(be3&&(be3.syn.length||be3.ant.length||be3.vi)){upsertWord({word:w.word,syn:be3.syn,ant:be3.ant,vi:be3.vi||''});okn++;}
      else fail.push(w.word);
    }
    await new Promise(function(r){setTimeout(r,600);});
  }
  newIds.forEach(function(id){makeCards(id);}); /* tạo đủ mọi loại thẻ sau khi đã giàu dữ liệu */
  /* FIX Lỗi A: re-import phải reset due về hôm nay cho TẤT CẢ thẻ của từ vừa import/cập nhật
     (giữ nguyên step để không phá SRS) — nếu không, due tương lai cũ làm nút Ôn bị trống */
  var _t0=todayStart();
  newIds.forEach(function(id){S.cards.forEach(function(c){if(c.wordId===id)c.due=_t0;});});
  save();
  addState.progress='';
  note='Đã thêm '+added+' từ mới'+(merged?' (cập nhật '+merged+' từ đã có từ file)':'')+(skipped?' (bỏ qua '+skipped+' từ đã có)':'')+'. Tra được từ điển '+okn+'/'+enr+' từ'+(fail.length?' (lỗi: '+fail.join(', ')+')':'')+'.';
  if(botMiss.length)note+=' Bot AI không bù được cho: '+botMiss.join(', ')+' (để trống phần thiếu, không bịa — tra lại sau nhé).';
  if(needy.length>LIMIT)note+=' Còn '+(needy.length-LIMIT)+' từ chưa tra — bấm "Tự tra từ điển" ở mục 4 để tra tiếp.';
  if(src==='file'){addState.fileName='';addState.fileText='';addState.isWS=false;}
  render();
}
function manualAdd(){
  var w=$('mw').value.trim(),v=$('mv').value.trim();
  if(!w){note='Nhập từ tiếng Anh đã chứ.';render();return;}
  if(findWordId(w)){note='Từ này đã có trong bộ nhớ.';render();return;}
  var id=upsertWord({word:w,vi:v});
  makeCards(id);note='Đã thêm "'+w+'".';render();
}
async function batchLookup(){
  var ids=Object.keys(S.words).filter(function(id){return !(S.words[id].meanings&&S.words[id].meanings.length);});
  if(!ids.length)return;
  addState.failed=[];var done=0;
  for(var i=0;i<ids.length;i++){
    var w=S.words[ids[i]];if(!w)continue;
    addState.progress='Đang tra '+w.word+' ('+(i+1)+'/'+ids.length+')…';render();
    var bar=$('pbar');if(bar)bar.style.width=Math.round(i/ids.length*100)+'%';
    try{
      var d=await dictLookup(w.word,{enrich:true}); /* FIX 3: đường upload/batch cần đủ syn/ant/IPA/audio đã làm giàu */
      upsertWord({word:w.word,phonetic:d.phonetic,audio:d.audio,meanings:d.meanings,syn:d.syn,ant:d.ant});
      refreshCards(ids[i]);
      /* FIX: dịch nền ví dụ tiếng Anh đầu tiên sang Việt, lưu vào defs[].exVi */
      try{var _bw=getWord(ids[i]);if(_bw&&await translateExample(_bw))save();}catch(x){}
    }catch(e){addState.failed.push(w.word);}
    done++;
    await new Promise(function(r){setTimeout(r,600);});
  }
  addState.progress='Xong: tra được '+(done-addState.failed.length)+'/'+done+' từ.';
  render();
}

function restore(){
  var f=$('rf').files[0];if(!f)return;
  /* FIX: nhập backup sẽ GHI ĐÈ toàn bộ — phải hỏi trước */
  if(!confirm('Nhập backup sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;
  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.cards)||typeof d.words!=='object')throw new Error('sai định dạng');
    /* FIX 2: lọc entry hỏng (thiếu word là chuỗi non-empty) để findWordId/render không crash;
       đồng thời bỏ thẻ mồ côi trỏ tới từ đã bị lọc */
    var clean={},skip=0,k;
    for(k in d.words){var e=d.words[k];
      if(e&&typeof e.word==='string'&&e.word.trim()){e.word=e.word.trim();clean[k]=e;}
      else skip++;
    }
    var cards=(d.cards||[]).filter(function(c){return c&&clean[c.wordId];});
    S={words:clean,cards:cards};save();
    note='Đã khôi phục '+cards.length+' thẻ.'+(skip?' (bỏ qua '+skip+' từ hỏng trong file backup)':'');
  }catch(e){note='Không nhập được: '+e.message;}render();};
  r.readAsText(f);
}
/* ============ TRỢ LÝ AI = BOT DAMU (keyless, chạy ngay trong trình duyệt) ============
   2026-10-24: tab Trợ lý AI CHÍNH LÀ bot damu — bỏ hẳn đường Gemini + key:
   KHÔNG ô nhập key, KHÔNG circuit breaker, KHÔNG thông báo "phải nhập key".
   Engine: Pollinations keyless (POST https://text.pollinations.ai/openai — cùng
   đường với bot ở hub/bot/), persona Capy gia sư damu. Phong cách giữ nguyên ý
   Nguyễn: hỏi về 1 từ -> ĐỐ từng từ đồng nghĩa rồi trái nghĩa, mỗi lượt đúng 1
   câu, gợi ý TIẾNG ANH trước, đáp án TIẾNG VIỆT chỉ cho sau khi người học đã
   trả lời hoặc chịu thua. Bot lỗi thì báo trung thực, không bịa câu trả lời. */
var AI_SYSTEM='Bạn là Capy — gia sư từ vựng tiếng Anh của app damu cho người Việt, giọng capybara hơi "mỏ hỗn" nhưng dễ thương: trêu nhẹ khi người học sai, khen khi đúng. Trả lời ngắn gọn, chính xác, bằng tiếng Việt (trừ ví dụ tiếng Anh). QUY TẮC ĐỐ TỪ (bắt buộc khi người học hỏi về một từ hoặc nhờ đố): hỏi LẦN LƯỢT TỪNG CÂU MỘT — đầu tiên đố các từ ĐỒNG NGHĨA (mỗi lượt đúng 1 từ), người học trả lời xong mới chấm câu đó: đúng thì khen, sai thì cho GỢI Ý TIẾNG ANH trước (định nghĩa/gợi ý bằng tiếng Anh), chờ trả lời lại; chỉ khi người học chịu thua hoặc sai lần 2 mới cho ĐÁP ÁN kèm nghĩa TIẾNG VIỆT. Hết đồng nghĩa mới chuyển sang TRÁI NGHĨA, cũng từng câu một. TUYỆT ĐỐI không liệt kê đáp án hàng loạt, không cho đáp án tiếng Việt trước khi người học tự trả lời.';
var AI_ERR={offline:'Mất mạng rồi — kiểm tra kết nối internet rồi gửi lại nhé.',quota:'Bot đang quá tải (lỗi 429). Nghỉ một lát rồi thử lại nhé.',server:'Máy chủ bot đang lỗi, thử lại sau vài phút nhé.',empty:'Bot không trả lời được câu này, thử hỏi cách khác nhé.'};
var aiMsgs=[],aiLoading=false,aiPending='',aiQ='';
/* Lịch sử chat persist vào localStorage (giữ ~50 tin nhắn gần nhất), restore khi load trang — schema giữ nguyên như cũ */

/* ---- Log lỗi AI — Nguyễn bấm "📋 Chép log lỗi" là có chữ để dán gửi, khỏi mở DevTools ---- */
var aiErrLog=[];
try{var _el=JSON.parse(localStorage.getItem('vocabAI.errlog'));if(Array.isArray(_el))aiErrLog=_el.slice(-20);}catch(e){aiErrLog=[];}
function aiLogErr(where,e){
  try{
    var em=String((e&&e.message)||e).slice(0,300),st='';
    try{st=String(e&&e.stack||'').split('\n').slice(0,4).join(' | ').slice(0,600);}catch(x){}
    aiErrLog.push({t:new Date().toISOString(),where:String(where),key:'bot-keyless (không cần key)',loading:!!aiLoading,msg:em,stack:st});

/* chép chữ vào clipboard; clipboard API cần https/localhost nên có fallback prompt để user tự Ctrl+C */
function copyText(txt,okmsg){

    else fallback();

}

  h+='<div class="row"><button onclick="aiCopyErrLog()">📋 Chép log lỗi</button><span class="small">Bot bị lỗi thì bấm nút này rồi dán gửi tôi — khỏi mở DevTools.</span></div></div>';

function aiScroll(){try{var m=$('aimsgs');if(m)m.scrollTop=m.scrollHeight;}catch(e){aiLogErr('aiScroll',e);}}
function aiNetMsg(code){
  if(code==='offline')return AI_ERR.offline;
  if(code.indexOf('slow:')===0)return 'Bot damu phản hồi quá chậm (hơn 60 giây). Bạn bấm "Gửi" lại thử nhé.';
  if(code.indexOf('blocked:')===0)return 'Không kết nối được tới máy chủ bot (Pollinations). Có thể mạng của bạn đang chặn nó — bấm nút "🔧 Kiểm tra kết nối" ở cuối tab này để xem chi tiết nhé.';
  if(code==='sourceerror')return 'Gọi bot gặp lỗi lạ (không phải do mạng). Chụp màn hình gửi cho tôi nhé.';
  return '';
}
/* ---- Engine bot damu keyless: POST https://text.pollinations.ai/openai (như hub/bot/) ----
   Promise.race với timeout cứng: AbortSignal chỉ hủy được fetch(), không hủy được
   r.text() nếu server gửi header rồi treo body — race đảm bảo không treo quá hạn. */
var AI_BOT_TIMEOUT_MS=60000;
async function botRaw(messages,timeoutMs,temp){
  var ms=timeoutMs||AI_BOT_TIMEOUT_MS;
  return Promise.race([
    (async function(){
      var sig=null;try{sig=AbortSignal.timeout(ms);}catch(e){}
      var r;
      try{
        r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},signal:sig,body:JSON.stringify({model:'openai',private:true,temperature:(typeof temp==='number'?temp:0.5),messages:messages})});
      }catch(e){throw classifyNetErr(e,'text.pollinations.ai');}
      if(r.status===429)throw new Error('quota|HTTP 429 từ Pollinations.');
      if(!r.ok)throw new Error('server|HTTP '+r.status+' từ Pollinations.');
      var raw='';
      try{raw=await r.text();}catch(e){throw new Error('server|Không đọc được dữ liệu từ bot.');}
      if(!raw||!raw.trim())throw new Error('empty');
      /* Envelope JSON mà không có content (model đốt hết token vào reasoning,
         test thật 2026-10-24 đã gặp) -> coi là 'empty' để nơi gọi thử lại,
         TUYỆT ĐỐI không hiển thị nguyên envelope/reasoning cho người học. */
      try{var j=JSON.parse(raw);if(j&&typeof j==='object'){
        if(j.choices&&j.choices[0]&&j.choices[0].message&&typeof j.choices[0].message.content==='string'&&j.choices[0].message.content.trim())return j.choices[0].message.content.trim();
        throw new Error('empty');
      }}catch(x){if(x&&x.message==='empty')throw x;}
      return raw.trim();
    })(),
    new Promise(function(_,rej){setTimeout(function(){rej(new Error('slow:text.pollinations.ai'));},ms+5000);})
  ]);
}
/* Chat: gửi kèm lịch sử gần nhất (tối đa 12 tin) để bot nhớ mạch ĐỐ từng câu —
   người học trả lời câu đố trước, bot chấm rồi mới hỏi câu tiếp theo.
   Lượt trả rỗng (empty) -> thử lại đúng 1 lần với temperature khác để tránh
   trúng lại bản cache lỗi phía Pollinations. */
async function botAsk(q){
  var hist=aiMsgs.slice(-12).map(function(m){return {role:m.r==='u'?'user':'assistant',content:m.t};});
  if(!hist.length||hist[hist.length-1].content!==q)hist.push({role:'user',content:q});
  var msgs=[{role:'system',content:AI_SYSTEM}].concat(hist);
  try{return await botRaw(msgs,AI_BOT_TIMEOUT_MS,0.5);}
  catch(e){
    if(String((e&&e.message)||'')==='empty'){aiLogErr('botAsk.emptyRetry',e);return botRaw(msgs,AI_BOT_TIMEOUT_MS,0.7);}
    throw e;
  }
}
/* Làm giàu từ bằng bot (đường upload .docx): 1 lượt keyless GỌN, chỉ JSON.
   Parse + kiểm chứng chặt chẽ (mảng chuỗi ngắn); hỏng/thiếu -> null để nơi gọi
   báo lỗi trung thực, TUYỆT ĐỐI không trả dữ liệu bịa. */
async function botEnrichWord(word){
  var prompt='Cho từ tiếng Anh "'+String(word||'')+'", trả về JSON đúng dạng {"syn":["..."],"ant":["..."],"vi":"..."} — syn: tối đa 5 từ đồng nghĩa tiếng Anh; ant: tối đa 5 từ trái nghĩa tiếng Anh (không có thì mảng rỗng); vi: nghĩa tiếng Việt ngắn gọn (tối đa 12 từ). Chỉ trả JSON thuần, không thêm chữ nào khác.';
  var t=await botRaw([{role:'system',content:'Bạn là từ điển Anh–Việt. Chỉ trả về JSON thuần, không giải thích, không markdown.'},{role:'user',content:prompt}],45000);
  var a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<=a)return null;
  var o;try{o=JSON.parse(t.slice(a,b+1));}catch(e){return null;}
  if(!o||typeof o!=='object')return null;
  function cleanList(x){if(!Array.isArray(x))return [];return x.map(function(v){return String(v||'').trim();}).filter(function(v){return v&&v.length<=40;}).slice(0,5);}
  var out={syn:cleanList(o.syn),ant:cleanList(o.ant),vi:(typeof o.vi==='string'?o.vi.trim().slice(0,120):'')};
  if(!out.syn.length&&!out.ant.length&&!out.vi)return null;
  return out;
}
async function aiSend(){
  /* KIỂM TRA trước, chỉ XÓA state khi chắc chắn sẽ gửi (gốc lỗi cũ "bấm hỏi cứ bị mất chữ").
     Bot keyless: KHÔNG còn bước kiểm tra key — có chữ là gửi thẳng. */
  var q=aiQ.trim();
  if(!q&&aiPending)q=aiPending;
  if(!q||aiLoading)return;              /* chưa có chữ / đang gửi → giữ nguyên mọi thứ */
  aiPending='';aiQ='';                  /* từ đây chắc chắn gửi → mới xóa */
  aiMsgs.push({r:'u',t:q});aiMsgsSave();aiLoading=true;
  try{render();aiScroll();}catch(e){aiLogErr('aiSend.render1',e);}  /* throw ở đây không được kẹt aiLoading */
  try{
    var ans=await botAsk(q);
    aiMsgs.push({r:'a',t:ans});
  }catch(e){
    aiLogErr('aiSend.botAsk',e);     /* mọi lỗi gọi bot đều vào log */
    var code=String((e&&e.message)||''),detail='';
    var pi=code.indexOf('|');
    if(pi>=0){detail=code.slice(pi+1);code=code.slice(0,pi);}
    var fmsg=AI_ERR[code]||aiNetMsg(code)||('Lỗi không rõ: '+code);
    if(detail)fmsg+='\nChi tiết kỹ thuật (chụp màn hình gửi tôi nếu cần): '+detail;
    aiMsgs.push({r:'a',t:'⚠️ '+fmsg});
  }finally{
    aiLoading=false;                    /* bảo vệ — không bao giờ kẹt ở "Đang nghĩ…" */
  }
  try{aiMsgsSave();render();aiScroll();}catch(e){aiLogErr('aiSend.render2',e);}
}
function askAIWord(word){
  aiPending='Đố tôi về từ "'+String(word||'')+'": hỏi lần lượt từng từ đồng nghĩa rồi từng từ trái nghĩa, đợi tôi trả lời từng câu rồi mới cho đáp án.';
  aiQ=aiPending; /* đồng thời set aiQ để aiSend đọc được và input hiển thị sẵn */
  go('ai');aiSend();
}

/* Di trú thẻ cũ (chưa có ans/need) sang dạng quiz gõ đáp án; giữ nguyên step/due */
(function(){
  if(S.v>=3)return;S.v=3;
  var keep=[];
  S.cards.forEach(function(c){
    var w=S.words[c.wordId];if(!w)return;
    var spec=cardSpec(w,c.kind);if(!spec)return;
    c.q=spec.q;c.aHTML=spec.aHTML;c.ans=spec.ans;c.need=spec.need;c.hints=spec.hints;
    keep.push(c);
  });
  S.cards=keep;save();
})();
